<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diashow Stufe 5&6</title>
    <style>
        :root {
            --header-height: 60px;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        
        /* Countdown-Leiste oben */
        #slideCountdown {

            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: var(--header-height);

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            background: #5c44e4;
            z-index: 9999;

            padding: 0 20px;
            box-sizing: border-box;

            box-shadow: 0 4px 15px rgba(0,0,0,.35);
        }
        
        
        /* Fortschrittsbalken */
        #slideProgress {
            width: 420px;
            max-width: 70vw;
        
            height: 8px;
        
            background: rgba(255,255,255,.15);
        
            border-radius: 999px;
        
            overflow: hidden;
        }
        
        
        #slideProgressBar {
            height: 100%;
            width: 100%;
        
            background: white;
        
            border-radius: inherit;
        
            transform-origin: left center;
        }
        
        
        /* Sekundenanzeige */
        #slideTime {
            font-size: 18px;
            font-weight: 700;
        
            color: white;
        
            min-width: 42px;
        
            text-align: right;
        }
        
        
        /* Slides */
        .slide {
            position: absolute;
        
            top: var(--header-height);
            left: 0;
        
            width: 100%;
            height: calc(100% - var(--header-height));
        
            border: none;
        
            opacity: 0;
            pointer-events: none;
        
            transform: scale(1.02);
            filter: blur(6px);
        
            transition:
                opacity .7s ease,
                transform .7s ease,
                filter .7s ease;
        }
        
        
        /* Aktiver Slide */
        .slide.active {
            opacity: 1;
        
            pointer-events: auto;
        
            transform: scale(1);
        
            filter: blur(0);
        }
        
        
        /* Bilder passend einpassen */
        img.slide {
            object-fit: contain;
            background-color: #5c44e4;
        }

        #eventTitle{

            color:white;
            font-size:22px;
            font-weight:700;

            min-width:260px;

            padding-left:12px;
        }

        #countdownCenter{

            display:flex;
            align-items:center;
            gap:14px;

        }

        #clock{

            color:white;
            font-size:22px;
            font-weight:700;

            min-width:110px;

            text-align:right;

            padding-right:12px;
        }

        #eventTitle {
            justify-self: start;
        }

        #clock {
            justify-self: end;
        }
    </style>
</head>
<body>
    <div id="slideCountdown">

        <div id="eventTitle">
            FuBaNaTu 2026 Stufe 5 &amp; 6
        </div>

        <div id="countdownCenter">
            <div id="slideProgress">
                <div id="slideProgressBar"></div>
            </div>

            <div id="slideTime">20 s</div>
        </div>

        <div id="clock">
            00:00:00
        </div>

    </div>
        
    <!-- SCHRITT 1: Erste Webseite (20 Sekunden) -->
    <iframe class="slide active" src="https://tournifyapp.com/live/fubanatu2026-stufe-5-6-maennlich/present" data-duration="20000"></iframe>

    <!-- SCHRITT 2: Das Bild (10 Sekunden) -->
    <img class="slide" src="diashow-stufe-5-6.jpg" data-duration="10000" alt="Bild">

    <!-- SCHRITT 3: Zweite Webseite (20 Sekunden) -->
    <iframe class="slide" src="https://tournifyapp.com/live/fubanatu2026-stufe-5-6-weiblich/present" data-duration="20000"></iframe>

    <!-- SCHRITT 4: Das gleiche Bild noch einmal (10 Sekunden) -->
    <img class="slide" src="diashow-stufe-5-6.jpg" data-duration="10000" alt="Bild">

    <!-- SCHRITT 5: Dritte Webseite (20 Sekunden) -->
    <iframe id="homepageFrame" class="slide" src="https://fubanatu2026.github.io/" data-duration="20000"></iframe>

    <!-- SCHRITT 6: Das gleiche Bild noch einmal (10 Sekunden) -->
    <img class="slide" src="diashow-stufe-5-6.jpg" data-duration="10000" alt="Bild">

    <script>
        
        const clock = document.getElementById("clock");
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        const progressBar = document.getElementById("slideProgressBar");
        const timeText = document.getElementById("slideTime");
        
        let slideStart = 0;
        let slideDuration = 0;
        let animationId = null;
        let preloadTimer = null;
        let mainTimer = null;
        let isManualChange = false;
        let isPaused = false;
        let pauseStart = 0;
        let pauseRemaining = 0;
        
        function stopAllTimers() {

            if (mainTimer) {
                clearTimeout(mainTimer);
                mainTimer = null;
            }

            if (preloadTimer) {
                clearTimeout(preloadTimer);
                preloadTimer = null;
            }

            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }

        function updateClock(){

            const now = new Date();

            clock.textContent =
                now.toLocaleTimeString("de-DE");

        }

        function startCountdown(duration) {

            if (isPaused) return;

            // Falls noch eine Animation läuft, beenden
            if (animationId !== null) {
                cancelAnimationFrame(animationId);
            }
        
            slideStart = performance.now();
            slideDuration = duration;
        
            function animate(now) {
        
                const elapsed = isPaused
                    ? pauseRemaining
                    : now - slideStart;
                const remaining = Math.max(0, slideDuration - elapsed);
        
                const percent = remaining / slideDuration;
        
                progressBar.style.transform = `scaleX(${percent})`;
                timeText.textContent = Math.ceil(remaining / 1000) + " s";
                
                const seconds = Math.ceil(remaining / 1000);

                if(seconds > 5){

                    progressBar.style.background = "white";
                    timeText.style.color = "white";

                }
                else if(seconds > 2){

                    progressBar.style.background = "#ffd93b";
                    timeText.style.color = "#ffd93b";

                }
                else{

                    progressBar.style.background = "#ff4040";
                    timeText.style.color = "#ff4040";

                }

                if (remaining > 0) {
                    animationId = requestAnimationFrame(animate);
                }
            }
        
            animationId = requestAnimationFrame(animate);
        }
        
        function autoScrollIframe(iframe) {

            iframe.onload = function () {

                const win = iframe.contentWindow;
                const doc = iframe.contentDocument;

                // ========= EINSTELLUNGEN =========

                // Oben warten (Millisekunden)
                const pauseAtTop = 3000;

                // Gesamtdauer des Slides
                const totalDuration = parseInt(iframe.dataset.duration);

                // ================================

                const scrollDuration = totalDuration - pauseAtTop;

                const start = performance.now();

                function animate(now) {

                    const elapsed = now - start;

                    // Während der Pause oben bleiben
                    if (elapsed < pauseAtTop) {
                        win.scrollTo(0, 0);
                        requestAnimationFrame(animate);
                        return;
                    }

                    // Fortschritt des Scrollens
                    const progress = Math.min(
                        (elapsed - pauseAtTop) / scrollDuration,
                        1
                    );

                    // Seitenhöhe jedes Mal neu berechnen,
                    // falls Bilder inzwischen geladen wurden
                    const maxScroll = Math.max(
                        0,
                        doc.documentElement.scrollHeight - win.innerHeight
                    );

                    win.scrollTo(0, maxScroll * progress);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // Am Ende sicher ganz unten landen
                        win.scrollTo(0, maxScroll);
                    }
                }

                requestAnimationFrame(animate);
            };

            // Seite neu laden
            iframe.src = iframe.src;
        }

        function preloadNextSlide() {

            const nextSlide = slides[(currentSlide + 1) % slides.length];

            if (nextSlide.tagName === "IFRAME") {
                nextSlide.src = nextSlide.src;
            }

}

        function runDiashow(forceIndex = null) {

            stopAllTimers();

            // aktuellen Slide verstecken
            slides[currentSlide].classList.remove('active');

            if (forceIndex !== null) {
                currentSlide = forceIndex;
            } else {
                currentSlide = (currentSlide + 1) % slides.length;
            }

            const slide = slides[currentSlide];

            // Scroll nur beim GitHub-Frame
            if (slide.id === "homepageFrame") {
                autoScrollIframe(slide);
            }

            slide.classList.add('active');

            const duration = parseInt(slide.dataset.duration, 10);

            startCountdown(duration);

            // Preload 5 Sekunden vorher
            preloadTimer = setTimeout(preloadNextSlide, Math.max(0, duration - 5000));

            // EINZIGER stabiler Timer
            mainTimer = setTimeout(() => {

                if (!isPaused) {
                    runDiashow();
                }

            }, duration);
                    }

        const firstDuration = parseInt(slides[currentSlide].dataset.duration, 10);

        startCountdown(firstDuration);

        // Bereits 5 Sekunden vor dem ersten Wechsel den nächsten Slide laden
        preloadTimer = setTimeout(preloadNextSlide, Math.max(0, firstDuration - 5000));

        setTimeout(runDiashow, firstDuration);

        updateClock();
        setInterval(updateClock,1000);

        document.addEventListener("keydown",function(e){

            if(e.code === "Space") {

                e.preventDefault();

                // ================= PAUSE =================
                if (!isPaused) {

                    isPaused = true;

                    // Countdown einfrieren
                    pauseRemaining =
                        slideDuration - (performance.now() - slideStart);

                    // Animation stoppen
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }

                    // Timer stoppen
                    stopAllTimers();

                }

                // ================= RESUME =================
                else {

                    isPaused = false;

                    // neuen Countdown starten mit Restzeit
                    slideStart = performance.now() - (slideDuration - pauseRemaining);

                    startCountdown(pauseRemaining);

                    // Restzeit bis Slidewechsel
                    mainTimer = setTimeout(() => {

                        if (!isPaused) {
                            runDiashow();
                        }

                    }, pauseRemaining);
                }
            }

            if(e.key === "ArrowRight") {

                runDiashow();

            }

            if(e.key === "ArrowLeft") {

                let newIndex = currentSlide - 1;

                if (newIndex < 0) newIndex = slides.length - 1;

                runDiashow(newIndex);
            }

            if(e.key==="f" || e.key==="F"){

                if(!document.fullscreenElement){
                    document.documentElement.requestFullscreen();
                }else{
                    document.exitFullscreen();
                }

            }

        });
    </script>
</body>
</html>
