<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diashow</title>
    <style>
        :root {
            --header-height: 60px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Countdown-Leiste oben */
        #slideCountdown {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            background: #5c44e4;
            z-index: 9999;

            padding: 0 20px;
            box-sizing: border-box;

            box-shadow: 0 4px 15px rgba(0,0,0,.35);
        }

        #eventTitle {
            justify-self: start;
            color: white;
            font-size: 22px;
            font-weight: 700;
            min-width: 260px;
            padding-left: 12px;
        }

        #countdownCenter {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Fortschrittsbalken */
        #slideProgress {
            width: 420px;
            max-width: 70vw;
            height: 8px;
            background: rgba(255,255,255,.15);
            border-radius: 999px;
            overflow: hidden;
        }

        #slideProgressBar {
            height: 100%;
            width: 100%;
            background: white;
            border-radius: inherit;
            transform-origin: left center;
        }

        /* Sekundenanzeige */
        #slideTime {
            font-size: 18px;
            font-weight: 700;
            color: white;
            min-width: 42px;
            text-align: right;
        }

        #clock {
            justify-self: end;
            color: white;
            font-size: 22px;
            font-weight: 700;
            min-width: 110px;
            text-align: right;
            padding-right: 12px;
        }

        /* Pause-Anzeige */
        #pauseBadge {
            justify-self: center;
            color: #ffd93b;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .5px;
            opacity: 0;
            transition: opacity .2s ease;
            pointer-events: none;
        }

        #pauseBadge.visible {
            opacity: 1;
        }

        /* Slides */
        .slide {
            position: absolute;
            top: var(--header-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--header-height));
            border: none;

            opacity: 0;
            pointer-events: none;
            transform: scale(1.02);
            filter: blur(6px);

            transition:
                opacity .7s ease,
                transform .7s ease,
                filter .7s ease;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            filter: blur(0);
        }

        img.slide {
            object-fit: contain;
            background-color: #5c44e4;
        }
    </style>
</head>
<body>

    <!-- ======================================================= -->
    <!-- =============  HIER PRO TURNIER ANPASSEN  ============== -->
    <!-- ======================================================= -->
    <!-- Trage hier die Werte für das jeweilige Turnier ein.      -->
    <!-- Der Rest der Datei muss NICHT angefasst werden.          -->
    <script>
        const CONFIG = {

            // Titel oben links in der Leiste
            eventTitle: "FuBaNaTu 2026 Stufe 9 & 10",

            // Erste Live-Ergebnis-Seite (z.B. männlich)
            website1Url: "https://tournifyapp.com/live/fubanatu2026-stufe-9-10-maennlich/present",

            // Zweite Live-Ergebnis-Seite (z.B. weiblich)
            website2Url: "https://tournifyapp.com/live/fubanatu2026-stufe-9-10-weiblich/present",

            // Turnier-Homepage (wird automatisch langsam durchgescrollt)
            homepageUrl: "https://fubanatu2026.github.io/",

            // Bilddatei, die dreimal zwischen den Webseiten gezeigt wird
            // (Datei muss im selben Ordner wie diese HTML-Datei liegen)
            imageUrl: "diashow-stufe-9-10.jpg",

            // Anzeigedauer in Millisekunden (1000 ms = 1 Sekunde)
            durations: {
                website: 20000,   // Dauer je Live-Ergebnis-Seite
                homepage: 20000,  // Dauer der Homepage
                image: 10000      // Dauer des Bildes
            }
        };
    </script>
    <!-- ======================================================= -->
    <!-- ===================  ENDE ANPASSUNG  ==================== -->
    <!-- ======================================================= -->

    <div id="slideCountdown">
        <div id="eventTitle"></div>
        <div id="countdownCenter">
            <div id="slideProgress">
                <div id="slideProgressBar"></div>
            </div>
            <div id="slideTime">20 s</div>
        </div>
        <div id="clock">00:00:00</div>
    </div>

    <div id="pauseBadge">⏸ PAUSIERT (Leertaste zum Fortsetzen)</div>

    <!-- Die eigentlichen Slides werden unten per JavaScript aus CONFIG erzeugt -->

    <script>
    (function () {

        // ---------- Titel aus CONFIG übernehmen ----------
        document.getElementById('eventTitle').textContent = CONFIG.eventTitle;

        // ---------- Reihenfolge der Diashow aus CONFIG ableiten ----------
        // Website 1 -> Bild -> Website 2 -> Bild -> Homepage -> Bild
        const slideDefs = [
            { type: 'iframe', src: CONFIG.website1Url, duration: CONFIG.durations.website },
            { type: 'img',    src: CONFIG.imageUrl,    duration: CONFIG.durations.image },
            { type: 'iframe', src: CONFIG.website2Url, duration: CONFIG.durations.website },
            { type: 'img',    src: CONFIG.imageUrl,    duration: CONFIG.durations.image },
            { type: 'iframe', src: CONFIG.homepageUrl, duration: CONFIG.durations.homepage, id: 'homepageFrame' },
            { type: 'img',    src: CONFIG.imageUrl,    duration: CONFIG.durations.image }
        ];

        // ---------- Slide-Elemente erzeugen und einfügen ----------
        const body = document.body;
        const slides = slideDefs.map((def, i) => {
            const el = document.createElement(def.type);
            el.className = 'slide' + (i === 0 ? ' active' : '');
            el.dataset.duration = def.duration;
            el.src = def.src;
            if (def.id) el.id = def.id;
            if (def.type === 'img') el.alt = 'Bild';
            body.appendChild(el);
            return el;
        });

        // ---------- UI-Elemente ----------
        const progressBar = document.getElementById('slideProgressBar');
        const timeText     = document.getElementById('slideTime');
        const clockEl      = document.getElementById('clock');
        const pauseBadge   = document.getElementById('pauseBadge');

        // ---------- Konfiguration ----------
        const PRELOAD_BEFORE_END_MS  = 5000; // wie viel früher der nächste Slide vorgeladen wird
        const SCROLL_PAUSE_AT_TOP_MS = 3000; // wie lange die Homepage oben stehen bleibt, bevor gescrollt wird

        // ---------- Zustand ----------
        let currentIndex        = 0;   // aktuell sichtbarer Slide
        let slideStartTimestamp = performance.now(); // Referenzpunkt "0 Sekunden" des aktuellen Slides
        let isPaused             = false;
        let pauseStartTimestamp  = 0;  // performance.now() beim Pausieren
        let hasPreloadedNext     = false;

        // ---------- Kern: Zeit, die im aktuellen Slide "verstrichen" ist ----------
        // Diese eine Funktion ist die einzige Zeitquelle für Fortschrittsbalken,
        // Countdown-Text, Weiterschalt-Logik, Preload und iFrame-Autoscroll.
        // Beim Pausieren "friert" sie ein, weil pauseStartTimestamp fix bleibt.
        function getElapsed(now) {
            if (isPaused) {
                return pauseStartTimestamp - slideStartTimestamp;
            }
            return now - slideStartTimestamp;
        }

        function getCurrentSlide() {
            return slides[currentIndex];
        }

        function getDuration(slide) {
            return parseInt(slide.dataset.duration, 10);
        }

        // ---------- Slide wechseln ----------
        function goToSlide(index) {
            const now = performance.now();

            getCurrentSlide().classList.remove('active');

            currentIndex = ((index % slides.length) + slides.length) % slides.length;

            const slide = getCurrentSlide();

            // Homepage-Slide beim Betreten neu laden, damit Scroll-Position
            // und Inhalt frisch sind (die anderen iFrames werden nur beim
            // Preload neu geladen, damit sie beim Umschalten schon bereitstehen).
            if (slide.id === 'homepageFrame') {
                slide.src = slide.src;
            }

            slide.classList.add('active');

            slideStartTimestamp = now;
            if (isPaused) {
                // Damit die eingefrorene Zeit für den neuen Slide bei 0 beginnt
                pauseStartTimestamp = now;
            }

            hasPreloadedNext = false;
        }

        function preloadNextSlide() {
            const nextSlide = slides[(currentIndex + 1) % slides.length];
            if (nextSlide.tagName === 'IFRAME') {
                nextSlide.src = nextSlide.src;
            }
        }

        // ---------- Homepage-Autoscroll ----------
        function updateHomepageScroll(slide, elapsed, duration) {
            if (slide.id !== 'homepageFrame') return;

            const win = slide.contentWindow;
            const doc = slide.contentDocument;
            if (!win || !doc || !doc.documentElement) return;

            if (elapsed < SCROLL_PAUSE_AT_TOP_MS) {
                win.scrollTo(0, 0);
                return;
            }

            const scrollDuration = Math.max(1, duration - SCROLL_PAUSE_AT_TOP_MS);
            const progress = Math.min((elapsed - SCROLL_PAUSE_AT_TOP_MS) / scrollDuration, 1);
            const maxScroll = Math.max(0, doc.documentElement.scrollHeight - win.innerHeight);

            win.scrollTo(0, maxScroll * progress);
        }

        // ---------- Countdown-UI ----------
        function updateProgressUI(remaining, duration) {
            const percent = remaining / duration;
            const seconds = Math.ceil(remaining / 1000);

            progressBar.style.transform = `scaleX(${percent})`;
            timeText.textContent = seconds + ' s';

            let color;
            if (seconds > 5) color = 'white';
            else if (seconds > 2) color = '#ffd93b';
            else color = '#ff4040';

            progressBar.style.background = color;
            timeText.style.color = color;
        }

        // ---------- Haupt-Loop ----------
        function tick(now) {
            const slide    = getCurrentSlide();
            const duration = getDuration(slide);
            const elapsed  = getElapsed(now);
            const remaining = Math.max(0, duration - elapsed);

            updateProgressUI(remaining, duration);
            updateHomepageScroll(slide, elapsed, duration);

            if (!hasPreloadedNext && elapsed >= duration - PRELOAD_BEFORE_END_MS) {
                preloadNextSlide();
                hasPreloadedNext = true;
            }

            if (!isPaused && elapsed >= duration) {
                goToSlide(currentIndex + 1);
            }

            requestAnimationFrame(tick);
        }

        // ---------- Pause / Resume ----------
        function togglePause() {
            if (!isPaused) {
                isPaused = true;
                pauseStartTimestamp = performance.now();
                pauseBadge.classList.add('visible');
            } else {
                const pausedDuration = performance.now() - pauseStartTimestamp;
                slideStartTimestamp += pausedDuration;
                isPaused = false;
                pauseBadge.classList.remove('visible');
            }
        }

        // ---------- Uhr oben rechts ----------
        function updateClock() {
            clockEl.textContent = new Date().toLocaleTimeString('de-DE');
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ---------- Tastatursteuerung ----------
        document.addEventListener('keydown', function (e) {

            if (e.code === 'Space') {
                e.preventDefault();
                togglePause();
                return;
            }

            if (e.key === 'ArrowRight') {
                goToSlide(currentIndex + 1);
                return;
            }

            if (e.key === 'ArrowLeft') {
                goToSlide(currentIndex - 1);
                return;
            }

            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });

        // ---------- Start ----------
        preloadNextSlide();
        requestAnimationFrame(tick);

    })();
    </script>
</body>
</html>
